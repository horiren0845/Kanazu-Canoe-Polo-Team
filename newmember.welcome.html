<html lang="ja">

    <style>
        /* 全体の設定 */
        :root {
            --primary-color: #0047ab; /* 金津ブルー */
            --accent-color: #ff9800;
            --bg-light: #f8f9fa;
            --text-dark: #333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.8;
            margin: 0;
            color: var(--text-dark);
            background-color: var(--bg-light);
        }

        /* ヘッダー */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* メインコンテンツの枠 */
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-top: 30px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 10px;
        }

        /* --- 地図のスタイル設定 --- */
        .map-container {
            margin-top: 20px;
            width: 100%;
            height: 350px; /* 地図の高さ（お好みで調整してください） */
            border-radius: 12px;
            overflow: hidden; /* 角丸からはみ出る地図を隠す */
            border: 1px solid #ddd;
        }

        /* Googleマップのiframeを枠いっぱいに広げる設定 */
        .map-container iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        /* 戻るボタン */
        .btn-back {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 25px;
            background-color: #666;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-back:hover {
            background-color: #444;
            transform: translateY(-2px);
