<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お知らせ詳細 - 金津カヌーポロ部</title>
    <style>
        :root {
            --primary-color: #0047ab;
            --bg-light: #f8f9fa;
            --text-dark: #333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.8;
            margin: 0;
            background-color: var(--bg-light);
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        /* 地図を囲む枠のスタイル */
        .map-outer {
            margin: 20px 0;
            width: 100%;
            height: 400px; /* 高さを指定 */
            background-color: #eee; /* 読み込み前のグレー */
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .map-outer iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #666;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold;">金津カヌーポロチーム</div>
</header>

<div class="container">
    <h1>【告知】新入生部活動体験会</h1>
    
    <h2>開催概要</h2>
    <ul>
        <li><strong>場所：</strong> 竹田川（金津高校近く）</li>
    </ul>

    <div class="map-outer">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3226.333857508006!2d136.223846676342!3d36.03658511019054!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5ff8eb9265f60631%3A0x8686d671846d0800!2z56aP5LqV55yM56uL6YeR5rSl6auY562J5a2m5qCh!5e0!3m2!1sja!2sjp!4v1711234567890!5m2!1sja!2sjp" allowfullscreen="" loading="lazy"></iframe>
    </div>

    <p>体験会では実際にカヌーに乗れます！</p>
    <a href="index.html" class="btn-back">トップへ戻る</a>
</div>

</body>
</html>
